name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只跑一个部署，新 push 取消进行中的旧部署
concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      # Firebase Hosting 部署在站点根路径，不设 PAGES_BASE_PATH
      - name: Build static site
        working-directory: frontend
        run: npm run build

      - name: 写 service account 到临时文件
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error::缺少仓库 Secret FIREBASE_SERVICE_ACCOUNT（airadar1 项目的服务账号 JSON）"; exit 1; }
          printf '%s' "$SA" > /tmp/sa.json

      - name: 部署 Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: npx firebase-tools@15 deploy --only hosting --project airadar1 --non-interactive
